name: nemonic-monitoring

# Prometheus + Grafana + node_exporter + cAdvisor
#
# - Prometheus: 메트릭 수집·저장 (시계열 DB)
# - Grafana: 시각화 (https://k14s208.p.ssafy.io/grafana/)
# - node_exporter: 호스트 OS 메트릭 (CPU/Mem/Disk/Network)
# - cAdvisor: 컨테이너별 메트릭 (Docker 컨테이너 cAdvisor)
#
# 7차 이후 추가 예정: kafka_exporter, opensearch_exporter, alertmanager

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nemonic-monitoring-prometheus
    restart: unless-stopped
    mem_limit: 1g
    user: "65534:65534"   # nobody — Prometheus 컨테이너 default user
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # 15일 보관 (default)
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/nemonic/data/prometheus:/prometheus
    expose:
      - "9090"
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:11.2.2
    container_name: nemonic-monitoring-grafana
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # 인증
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"

      # nginx /grafana/ sub-path 노출
      GF_SERVER_ROOT_URL:           "https://k14s208.p.ssafy.io/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_HTTP_ADDR:           "0.0.0.0"
      GF_SERVER_HTTP_PORT:           "3000"

      # 일부 비활성 (외부 노출 환경 보안)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /opt/nemonic/data/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    networks:
      - cicd-net
    healthcheck:
      # GF_SERVER_SERVE_FROM_SUB_PATH=true 라서 /api/health가 /grafana/api/health로 이동.
      # CMD 형식(shell parsing 안 거침) + --spider로 escape 함정 회피.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: nemonic-monitoring-node-exporter
    restart: unless-stopped
    mem_limit: 128m
    pid: host
    # 호스트의 root filesystem을 read-only로 마운트해서 디스크 메트릭 수집
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+)($$|/)
      - --web.listen-address=0.0.0.0:9100
    expose:
      - "9100"
    networks:
      - cicd-net

  # Nginx stub_status → Prometheus 포맷 변환 사이드카.
  # 메인 nginx (nemonic-prod_nginx) 의 /stub_status 엔드포인트를 스크랩.
  # cicd-net에 같이 붙어 있어서 도커 DNS의 'nginx' 이름으로 접근 가능.
  # stub_status는 default.conf에서 nginx-net 내부에만 노출 (외부 차단).
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nemonic-monitoring-nginx-exporter
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    expose:
      - "9113"
    networks:
      - cicd-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nemonic-monitoring-cadvisor
    restart: unless-stopped
    mem_limit: 256m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # Docker socket 명시 마운트 — 컨테이너 메타데이터(name, image, label) 수집용
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --port=8080
      - --housekeeping_interval=15s
      # --docker_only=true 제거: Ubuntu 24의 cgroup v2 환경에서 컨테이너 cgroup
      # 인식을 막아 root cgroup 메트릭만 노출되는 문제. 모든 cgroup 노출하면
      # 컨테이너도 자동 포함됨.
    expose:
      - "8080"
    networks:
      - cicd-net

networks:
  cicd-net:
    name: nemonic-prod_cicd-net
    external: true
