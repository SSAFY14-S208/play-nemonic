[SERVICE]
    Flush               5
    Log_Level           info
    Daemon              off
    Parsers_File        /fluent-bit/etc/parsers.conf
    HTTP_Server         On
    HTTP_Listen         0.0.0.0
    HTTP_Port           2020

[INPUT]
    Name                tail
    Path                /var/lib/docker/containers/*/*-json.log
    Parser              docker
    Tag                 docker.<container_id>
    Tag_Regex           /var/lib/docker/containers/(?<container_id>[a-z0-9]+)/.*\.log$
    Mem_Buf_Limit       50MB
    Skip_Long_Lines     On
    Refresh_Interval    10
    DB                  /flb-state/tail-db.sqlite
    DB.Sync             Normal

[FILTER]
    Name                record_modifier
    Match               *
    Record              hostname ${HOSTNAME}

[OUTPUT]
    Name                kafka
    Match               *
    Brokers             kafka:9092
    Topics              nemonic-logs
    Timestamp_Key       @timestamp
    Retry_Limit         5
    rdkafka.compression.codec   snappy
    rdkafka.request.required.acks 1
