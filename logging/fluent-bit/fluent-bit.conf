[SERVICE]
    Flush               5
    Log_Level           info
    Daemon              off
    Parsers_File        /fluent-bit/etc/parsers.conf
    HTTP_Server         On
    HTTP_Listen         0.0.0.0
    HTTP_Port           2020

[INPUT]
    Name                tail
    Path                /var/lib/docker/containers/*/*-json.log
    Parser              docker
    Tag                 docker.*
    Mem_Buf_Limit       50MB
    Skip_Long_Lines     On
    Refresh_Interval    10
    DB                  /flb-state/tail-db.sqlite
    DB.Sync             Normal
    Docker_Mode         On
    Docker_Mode_Flush   5

[FILTER]
    Name                lua
    Match               docker.*
    script              /fluent-bit/etc/extract_container_id.lua
    call                extract_container_id

[FILTER]
    Name                record_modifier
    Match               *
    Record              hostname ${HOSTNAME}

[OUTPUT]
    Name                kafka
    Match               *
    Brokers             kafka:9092
    Topics              nemonic-logs
    Timestamp_Key       @timestamp
    Timestamp_Format    iso8601
    Retry_Limit         5
    rdkafka.compression.codec   snappy
    rdkafka.request.required.acks 1
