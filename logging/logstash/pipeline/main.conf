input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["nemonic-logs"]
    group_id          => "logstash-nemonic"
    client_id         => "logstash-1"
    codec             => "json"
    consumer_threads  => 2
    auto_offset_reset => "latest"
  }
}

filter {
  if [tag] {
    grok {
      match => { "tag" => "docker\.%{DATA:container_id}" }
      tag_on_failure => ["_grokparsefailure_tag"]
    }
  }

  if [log] {
    mutate { rename => { "log" => "message" } }
  }

  if [message] {
    mutate { strip => ["message"] }
  }

  if [container_id] {
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:application}\]\s+\[%{DATA:thread}\]\s+%{NOTSPACE:logger}\s+:\s+%{GREEDYDATA:log_message}" }
      tag_on_failure => ["_grokparsefailure_spring"]
      add_tag => ["spring_boot"]
    }

    if "spring_boot" in [tags] {
      mutate { strip => ["thread", "application", "logger"] }
      date {
        match => ["log_timestamp", "ISO8601"]
        target => "@timestamp"
        remove_field => ["log_timestamp"]
      }
    }
  }

  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "nemonic-app-logs"
    }
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    ecs_compatibility => disabled
  }
}
