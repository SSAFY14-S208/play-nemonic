input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["nemonic-logs"]
    group_id          => "logstash-nemonic-v4"
    client_id         => "logstash-1"
    codec             => "json"
    consumer_threads  => 1
    auto_offset_reset => "latest"
    decorate_events   => true
    session_timeout_ms => "30000"
    request_timeout_ms => "40000"
  }
}

filter {
  # 1. 자기 자신 로그(Logstash, Fluent Bit) 드롭 - 무한 루프 방지
  #    log_tag(docker file path)에 컨테이너 이름이 안 들어가서(ID만) 보존하되
  #    실효 매칭은 message 시그니처 기반.
  if [log_tag] =~ /logstash|fluent-bit|fluentbit/ {
    drop { }
  }
  # Logstash 자기 로그: [main][<64자 hex hash>] (Logstash node 시그니처)
  if [message] =~ /\[main\]\[[a-f0-9]{64}\]/ {
    drop { }
  }
  # Fluent Bit 자기 로그: [YYYY/MM/DD HH:MM:SS] (slash 형식 timestamp)
  if [message] =~ /^\[\d{4}\/\d{2}\/\d{2}\s+\d{2}:\d{2}:\d{2}\]/ {
    drop { }
  }

  # 2. Docker 'log' 필드 -> 'message'
  if [log] {
    mutate { rename => { "log" => "message" } }
  }

  # 3. 메시지 정규화
  if [message] {
    mutate { strip => ["message"] }
  }

  # 4. JSON 시도 (biz-events 후보) — 메시지가 '{' 로 시작할 때만
  #    성공하면 JSON 키들이 root로 풀림 (event_name, level, service 등)
  if [message] =~ /^\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # 5. event_name 있으면 -> biz-events
  if [event_name] {
    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "biz-events"
        "log_type" => "biz"
      }
    }
  }

  # 6. nginx access pattern (분류 미정 시) -> access-logs
  if ![log_type] {
    grok {
      match => { "message" => "%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:nginx_timestamp}\] \"%{WORD:http_method} %{DATA:http_uri} HTTP/%{NUMBER:http_version:float}\" %{NUMBER:status_code:int} (?:%{NUMBER:body_bytes_sent:int}|-) \"%{DATA:http_referer}\" \"%{DATA:http_user_agent}\" \"%{DATA:http_x_forwarded_for}\"" }
      add_tag => ["nginx_access"]
      tag_on_failure => ["_grokparsefailure_nginx"]
    }
    if "nginx_access" in [tags] {
      date {
        match => ["nginx_timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
        remove_field => ["nginx_timestamp"]
      }
      mutate {
        add_field => {
          "[@metadata][index_prefix]" => "access-logs"
          "log_type" => "access"
        }
      }
    }
  }

  # 7. Spring Boot grok (분류 미정 시) - log_level 등 부여
  if ![log_type] {
    grok {
      match => { "message" => "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:application}\]\s+\[%{DATA:thread}\]\s+%{NOTSPACE:logger}\s+:\s+%{GREEDYDATA:log_message}" }
      tag_on_failure => ["_grokparsefailure_spring"]
      add_tag => ["spring_boot"]
    }
    if "spring_boot" in [tags] {
      mutate { strip => ["thread", "application", "logger"] }
      date {
        match => ["log_timestamp", "ISO8601"]
        target => "@timestamp"
        remove_field => ["log_timestamp"]
      }
    }
  }

  # 8. error-logs (분류 미정 + ERROR/Exception 키워드)
  if ![log_type] {
    if [log_level] in ["ERROR", "FATAL"] {
      mutate {
        add_field => {
          "[@metadata][index_prefix]" => "error-logs"
          "log_type" => "error"
        }
      }
    } else if [message] =~ /\[ERROR\]|\[FATAL\]|Exception:\s|caused by:|(?i)stack trace/ {
      mutate {
        add_field => {
          "[@metadata][index_prefix]" => "error-logs"
          "log_type" => "error"
        }
      }
    }
  }

  # 9. fallback -> system-logs
  if ![log_type] {
    mutate {
      add_field => {
        "[@metadata][index_prefix]" => "system-logs"
        "log_type" => "system"
      }
    }
  }
}

output {
  opensearch {
    hosts => ["http://opensearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    ecs_compatibility => disabled
  }
}
