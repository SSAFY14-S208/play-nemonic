# ============================================================
# nemonic - 단일 서버 리버스 프록시 설정
# 모든 외부 요청을 443(HTTPS)으로 받아서 내부 서비스로 분배
# ============================================================

# HTTP(80) -> HTTPS(443) 리다이렉트
server {
    listen 80;
    server_name k14s208.p.ssafy.io;

    # Let's Encrypt 갱신용 (나중에 certbot 쓸 때 필요)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 전부 HTTPS로
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443) 메인 서버
server {
    listen 443 ssl;
    http2 on;
    server_name k14s208.p.ssafy.io;

    # SSL 인증서 (나중에 실제 인증서로 교체)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 업로드 용량 (MinIO 대용량 파일 대비)
    client_max_body_size 500M;

    # 공통 프록시 헤더
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ========================================================
    # /jenkins/ -> Jenkins 컨테이너
    # ========================================================
    location /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;

        # Jenkins 특수 설정
        proxy_redirect default;
        proxy_set_header Connection        "";
        proxy_request_buffering off;

        # 긴 빌드 로그 스트리밍 대응
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # GitLab Webhook 수신 (POST)
        proxy_buffering off;
    }

    # ========================================================
    # /minio/ -> MinIO Web Console
    # (MinIO 공식 Nginx 리버스 프록시 권장 설정)
    # https://min.io/docs/minio/linux/integrations/setup-nginx-proxy-with-minio.html
    # ========================================================
    location /minio/ {
        # 경로 제거 후 Console로 전달
        rewrite ^/minio/(.*) /$1 break;

        proxy_pass http://minio:9001;

        # Console이 리다이렉트 URL을 올바르게 계산하게 함
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy     true;

        # WebSocket 지원 (Console 실시간 통신)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 버퍼링/청크 비활성화 (MinIO 필수)
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        real_ip_header X-Real-IP;
    }

    # ========================================================
    # /api/ -> Spring Boot 애플리케이션
    # ========================================================
    location /api/ {
        proxy_pass http://app:8080/;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ========================================================
    # /actuator/ -> Spring Boot Actuator (smoke test용)
    # ========================================================
    location /actuator/ {
        proxy_pass http://app:8080/actuator/;
    }

    # ========================================================
    # / -> Next.js Frontend (Standalone Server)
    # ========================================================
    location / {
        proxy_pass http://frontend:3000;
        
        # Host 헤더 그대로 전달 (Next.js가 절대 URL 만들 때 사용)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js HMR / WebSocket 지원 (개발용 + 일부 라이브러리)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # SSR 응답 시간 여유
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # ========================================================
    # /_dashboards/ -> OpenSearch Dashboards (BasicAuth 보호)
    # nemonic 로그 분석 대시보드
    # ========================================================
    location /_dashboards {
        # BasicAuth: 외부 노출이지만 비밀번호로 보호
        auth_basic "Nemonic Logs (Restricted)";
        auth_basic_user_file /etc/nginx/.htpasswd_dashboards;

        proxy_pass http://opensearch-dashboards:5601;

        # WebSocket 지원 (Dashboards 실시간 통신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dashboards 부팅 후 첫 응답 시간 여유 + 큰 검색 결과 대응
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
    }
    # ========================================================
    # /_next/ -> Next.js 정적 파일 (캐싱 최적화)
    # ========================================================
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # 정적 파일은 1년 캐시 (파일명에 hash 들어있어서 안전)
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
