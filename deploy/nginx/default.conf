# ============================================================
# nemonic - 단일 서버 리버스 프록시 설정
# 모든 외부 요청을 443(HTTPS)으로 받아서 내부 서비스로 분배
# ============================================================

# ============================================================
# 8081 -> nginx-prometheus-exporter 전용 stub_status
# 내부 docker network 안에서만 노출 (compose의 ports 매핑 없음 → 호스트
# 인터페이스에서 보이지 않음). nginx-exporter 컨테이너가
# http://nginx:8081/stub_status 로 스크랩한다.
# ============================================================
server {
    listen 8081;
    server_name _;

    location /stub_status {
        stub_status;
        access_log off;
        # 도커 내부 네트워크 대역만 허용. cicd-net이 bridge default 라
        # 172.16.0.0/12 안에 들어옴.
        allow 172.16.0.0/12;
        deny all;
    }

    # 그 외 경로는 404 — stub_status 외에는 노출 안 함.
    location / { return 404; }
}

# HTTP(80) -> HTTPS(443) 리다이렉트
server {
    listen 80;
    server_name k14s208.p.ssafy.io;

    # Let's Encrypt 갱신용 (나중에 certbot 쓸 때 필요)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 전부 HTTPS로
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# k14s208.p.ssafy.io:9443 -> MinIO S3 API (port 9000)
# presigned URL용 외부 노출. DNS 추가 불가 환경에서 같은 도메인의
# 별도 포트로 분리하여 9000을 통째로 프록시한다 (path-based 프록시는
# presigned URL 서명을 깨므로 사용 불가).
# - 인증서: 메인 도메인 fullchain.pem 그대로 사용
# - 방화벽/SG: 9443 TCP inbound 허용 필수
# - 만약 9443이 corporate proxy에서 막히면 8443 등으로 listen + ports 동시 변경
# ============================================================
server {
    listen 9443 ssl;
    http2 on;
    server_name k14s208.p.ssafy.io;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 대용량 업로드 대응
    client_max_body_size 500M;

    # MinIO S3 API 권장 설정
    # https://min.io/docs/minio/linux/integrations/setup-nginx-proxy-with-minio.html
    location / {
        proxy_pass http://minio:9000;

        # presigned URL 서명 검증 (Host와 path 그대로 전달해야 함)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MinIO 권장: 스트리밍 업/다운로드
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}

# HTTPS(443) 메인 서버
server {
    listen 443 ssl;
    http2 on;
    server_name k14s208.p.ssafy.io;

    # SSL 인증서 (나중에 실제 인증서로 교체)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 업로드 용량 (MinIO 대용량 파일 대비)
    client_max_body_size 500M;

    # 공통 프록시 헤더
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ========================================================
    # /jenkins/ -> Jenkins 컨테이너
    # ========================================================
    location /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;

        # Jenkins 특수 설정
        proxy_redirect default;
        proxy_set_header Connection        "";
        proxy_request_buffering off;

        # 긴 빌드 로그 스트리밍 대응
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # GitLab Webhook 수신 (POST)
        proxy_buffering off;
    }

    # ========================================================
    # /minio/<bucket>/... -> MinIO S3 API (port 9000)
    # 백엔드 MINIO_PUBLIC_URL=https://${DOMAIN}/minio 패턴 대응.
    # presigned URL과 public read URL 모두 이 경로로 들어온다.
    # 정규식 location은 prefix(/minio/)보다 우선 매칭되므로 console과 충돌 없음.
    # 버킷 이름이 'nemonic'으로 고정 — 바뀌면 정규식도 함께 수정해야 함.
    # ========================================================
    location ~ ^/minio/nemonic(/.*)?$ {
        rewrite ^/minio/(.*)$ /$1 break;

        proxy_pass http://minio:9000;

        # presigned URL 서명 검증 — 백엔드는 Host=${DOMAIN}로 서명함.
        # nginx가 /minio prefix를 떼고 /<bucket>/<key>로 forward하므로
        # MinIO가 보는 canonical request가 서명과 일치한다.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MinIO 권장: 스트리밍 업/다운로드
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        client_max_body_size 500M;
    }

    # ========================================================
    # /minio/ -> MinIO Web Console
    # (MinIO 공식 Nginx 리버스 프록시 권장 설정)
    # https://min.io/docs/minio/linux/integrations/setup-nginx-proxy-with-minio.html
    # ========================================================
    location /minio/ {
        # 경로 제거 후 Console로 전달
        rewrite ^/minio/(.*) /$1 break;

        proxy_pass http://minio:9001;

        # Console이 리다이렉트 URL을 올바르게 계산하게 함
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy     true;

        # WebSocket 지원 (Console 실시간 통신)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 버퍼링/청크 비활성화 (MinIO 필수)
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        real_ip_header X-Real-IP;
    }

    # ========================================================
    # /api/ -> Spring Boot 애플리케이션
    # proxy_pass에 trailing slash 없음 — 있으면 nginx가 /api/ prefix를 떼서
    # Spring의 @RequestMapping("/api/...") 매핑과 안 맞아 404.
    # variable + resolver 패턴 (TROUBLESHOOTING #23) — app 컨테이너
    # 재생성 시 stale IP로 인한 503 회피.
    # ========================================================
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream "app:8080";
        proxy_pass http://$app_upstream;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ========================================================
    # /ws/ -> Spring Boot STOMP WebSocket (raw, not SockJS)
    # 릴레이 드로잉 등 실시간 엔드포인트 — /ws/relay 그대로 백엔드 전달.
    # proxy_pass에 trailing slash 없음에 주의 (있으면 prefix가 잘려 404).
    # ========================================================
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream "app:8080";
        proxy_pass http://$app_upstream;

        # WebSocket upgrade — 서버 블록에 proxy_http_version 1.1 이미 설정됨
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 드로잉 세션 idle 유지 (기본 60s면 도중 끊김)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # STOMP frame 즉시 전달
        proxy_buffering off;
    }

    # ========================================================
    # /actuator/ -> Spring Boot Actuator (smoke test용)
    # 재배포 직후 smoke test가 stale IP로 503 받지 않도록 resolver 패턴 사용.
    #
    # proxy_pass에 URI 부분(/actuator/)을 붙이면 안 됨: nginx는 변수가 포함된
    # proxy_pass에서 URI가 지정되면 prefix 매칭 영역을 교체하지 않고 URI를
    # directive 그대로 사용한다. 그러면 /actuator/health 요청이 upstream에
    # /actuator/ 로 잘려서 전달되고, Spring이 trailing-slash 매칭 차이로 500을
    # 반환 → smoke test 실패. 다른 location들과 동일하게 URI 부분 없이 둔다.
    # ========================================================
    location /actuator/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream "app:8080";
        proxy_pass http://$app_upstream;
    }

    # ========================================================
    # /swagger-ui/ + /v3/api-docs -> Springdoc OpenAPI (공개)
    # Swagger UI의 JS가 /v3/api-docs를 절대 경로로 호출하므로
    # /api/ prefix 통해서가 아니라 root에 직접 노출.
    # variable + resolver 패턴 (TROUBLESHOOTING #23) — app 컨테이너
    # 재생성 시 stale IP 회피.
    # ========================================================
    location /swagger-ui/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream "app:8080";
        proxy_pass http://$app_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $app_upstream "app:8080";
        proxy_pass http://$app_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # / -> Next.js Frontend (Standalone Server)
    # frontend 컨테이너 재생성 시 stale IP 회피 위해 resolver 패턴 사용.
    # ========================================================
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;

        # Host 헤더 그대로 전달 (Next.js가 절대 URL 만들 때 사용)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / WebSocket 지원 (개발용 + 일부 라이브러리)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSR 응답 시간 여유
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # ========================================================
    # /grafana/ -> Grafana
    # nemonic 메트릭 대시보드 (Prometheus + node + cAdvisor)
    # 백오피스 /admin/dashboard iframe 임베딩용 — anonymous Viewer 모드.
    # BasicAuth는 iframe과 상극이라 제거. 노출 범위는 Grafana 측에서
    # GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer 로 read-only 제한.
    # ========================================================
    location /grafana/ {
        # Docker embedded DNS로 매 요청마다 hostname resolve (캐시 10s).
        # nginx는 부팅 시 한 번만 DNS lookup하고 캐시하는데, grafana 컨테이너
        # 재생성 시 새 IP를 못 따라가서 502 발생. set + variable proxy_pass로
        # 회피.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream "grafana:3000";

        # GF_SERVER_SERVE_FROM_SUB_PATH=true 라서 Grafana가 /grafana/ prefix를
        # 인식. nginx는 prefix 제거 없이 그대로 전달 (proxy_pass에 trailing
        # slash 없음).
        proxy_pass http://$grafana_upstream;

        # WebSocket (Grafana Live - real-time panels)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering off;
    }

    # ========================================================
    # /_dashboards/ -> OpenSearch Dashboards (BasicAuth 보호)
    # nemonic 로그 분석 대시보드
    # ========================================================
    location /_dashboards {
        # BasicAuth: 외부 노출이지만 비밀번호로 보호
        auth_basic "Nemonic Logs (Restricted)";
        auth_basic_user_file /etc/nginx/.htpasswd_dashboards;

        proxy_pass http://opensearch-dashboards:5601;

        # WebSocket 지원 (Dashboards 실시간 통신용)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dashboards 부팅 후 첫 응답 시간 여유 + 큰 검색 결과 대응
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering off;
    }
    # ========================================================
    # /_next/ -> Next.js 정적 파일 (캐싱 최적화)
    # ========================================================
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # 정적 파일은 1년 캐시 (파일명에 hash 들어있어서 안전)
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}