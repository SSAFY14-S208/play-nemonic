# Prometheus scrape config for nemonic monitoring
#
# Targets:
#   - prometheus 자체 (self-monitoring)
#   - node_exporter (호스트 OS 메트릭)
#   - cadvisor (컨테이너별 메트릭)
#
# 향후 추가 후보 (7차):
#   - kafka_exporter (consumer lag, broker)
#   - opensearch_exporter (cluster health, query latency)
#   - blackbox_exporter (HTTP probe)

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: nemonic-prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
