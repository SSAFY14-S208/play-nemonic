# Grafana datasource auto-provisioning
# 기동 시 Prometheus를 자동으로 등록 — UI에서 수동 추가 불필요

apiVersion: 1

datasources:
  - name: Prometheus
    # uid를 명시 — provisioned dashboard JSON에서 "uid": "prometheus" 로 참조한다.
    # 명시 안 하면 Grafana가 자동 생성하는데 매 환경마다 달라져서 import 시 panel이 깨짐.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
