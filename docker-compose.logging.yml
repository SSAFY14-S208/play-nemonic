name: nemonic-logging

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: nemonic-logging-kafka
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "1"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_CFG_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - /opt/nemonic/data/kafka:/bitnami/kafka
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: nemonic-logging-opensearch
    restart: unless-stopped
    mem_limit: 3g
    environment:
      cluster.name: "nemonic-logs"
      node.name: "os-1"
      discovery.type: "single-node"
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - /opt/nemonic/data/opensearch:/usr/share/opensearch/data
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: nemonic-logging-dashboards
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_BASEPATH: "/_dashboards"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5601"
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/_dashboards/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: nemonic-logging-logstash
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - ./logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logging/logstash/config:/usr/share/logstash/config:ro
    networks:
      - cicd-net

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: nemonic-logging-fluent-bit
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./logging/fluent-bit:/fluent-bit/etc:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks:
      - cicd-net

networks:
  cicd-net:
    name: nemonic-prod_cicd-net
    external: true
