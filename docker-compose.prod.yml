# ============================================================
# infra/dev 브랜치의 docker-compose.prod.yml
#
# Registry 기반 배포로 전환:
# - app, frontend는 build: 가 아닌 image: 사용
# - Jenkins가 이미지 빌드 + push
# - EC2 호스트는 docker pull만
#
# 실행 위치: /opt/nemonic/infra/
# ============================================================

name: nemonic-prod

services:
  # ============================================================
  # Nginx - 단일 진입점 (443)
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # MinIO S3 API 외부 노출 (presigned URL용)
      - "9443:9443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/.htpasswd_dashboards:/etc/nginx/.htpasswd_dashboards:ro
      - ./deploy/nginx/.htpasswd_grafana:/etc/nginx/.htpasswd_grafana:ro
    depends_on:
      - jenkins
      - minio
      - frontend
    networks:
      - cicd-net

  # ============================================================
  # Container Registry - 자체 호스팅 Docker Registry
  # 외부 노출 없음 (localhost:5000 또는 컨테이너 간 registry:5000)
  # Jenkins가 push, EC2 호스트가 pull
  # ============================================================
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # 호스트 docker daemon이 127.0.0.1:5000으로 pull 가능하도록
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cicd-net

  # ============================================================
  # Jenkins - CI/CD 자동 배포
  # ============================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: nemonic/jenkins:latest
    restart: unless-stopped
    user: root
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Dhudson.model.DirectoryBrowserSupport.CSP="
    expose:
      - "8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/nemonic:/opt/nemonic
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - cicd-net

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    # 호스트 loopback에만 노출 — SSH 터널로만 접근 가능 (외부 인터넷 X).
    # IntelliJ 같은 DB tool로 원격 접속 시 SSH 터널 + localhost:5432 사용.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cicd-net

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    # 호스트 loopback에만 노출 — SSH 터널로만 접근 가능 (외부 인터넷 X).
    # RedisInsight, redis-cli 등 외부 도구는 SSH 터널 + localhost:6379 사용.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cicd-net

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN}/minio/
      # presigned URL 서명에 사용될 외부 host. 클라이언트가 받을 URL과 일치해야
      # MinIO가 서명을 검증할 때 통과한다.
      MINIO_SERVER_URL: ${MINIO_PUBLIC_URL}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cicd-net

  # ============================================================
  # MinIO 정책 초기화 (oneshot)
  #
  # MinIO 기동 후 1회 실행되며 다음을 수행한다:
  #   1. ${MINIO_BUCKET} 버킷 생성 (없을 때만)
  #   2. ${MINIO_PUBLIC_PREFIXES}에 나열된 prefix들에 anonymous read 정책 부여
  #      (= GET/HEAD만 인증 없이 허용, PUT/DELETE는 여전히 root credential 필요)
  #
  # 멱등 — 매 배포마다 다시 돌아도 동일 상태로 수렴.
  # 신규 prefix를 공개하려면 .env의 MINIO_PUBLIC_PREFIXES에만 추가하면 됨.
  # ============================================================
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nemonic}
      # 쉼표 구분. 예: "relay,gallery,share"
      MINIO_PUBLIC_PREFIXES: ${MINIO_PUBLIC_PREFIXES:-relay,gallery,share}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[minio-init] alias 등록"
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

        echo "[minio-init] 버킷 보장: $$MINIO_BUCKET"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

        echo "[minio-init] anonymous download 정책 부여"
        IFS=','
        for prefix in $$MINIO_PUBLIC_PREFIXES; do
          prefix=$$(echo "$$prefix" | tr -d '[:space:]')
          [ -z "$$prefix" ] && continue
          echo "  - local/$$MINIO_BUCKET/$$prefix"
          mc anonymous set download "local/$$MINIO_BUCKET/$$prefix"
        done

        echo "[minio-init] 완료"
    networks:
      - cicd-net

  # ============================================================
  # Spring Boot 애플리케이션
  # Registry에서 pull (build 안 함)
  # 이미지: localhost:5000/nemonic/app:latest
  # ============================================================
  app:
    image: localhost:5000/nemonic/app:latest
    pull_policy: always   # 매번 pull 시도 (latest 태그 갱신 감지)
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Redis URL 형식 (코드가 REDIS_URL 직접 사용 시).
      # Spring Data Redis 표준은 spring.data.redis.url → SPRING_DATA_REDIS_URL.
      SPRING_DATA_REDIS_URL: ${REDIS_URL}
      REDIS_URL: ${REDIS_URL}
      # 내부용 SDK: 컨테이너 간 직접 호출 (putObject/getObject 등)
      MINIO_ENDPOINT: http://minio:9000
      # 외부용 SDK: presigned URL 생성 시 사용. 클라이언트가 이 host로 직접 접근.
      # 같은 도메인의 9443 포트를 nginx가 SSL 종단 후 minio:9000으로 프록시.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nemonic}
      JAVA_OPTS: "-Xms512m -Xmx1024m"
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_ACCESS_TOKEN_EXPIRATION: ${ADMIN_JWT_ACCESS_TOKEN_EXPIRATION:-30m}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_LOGIN_ID: ${ADMIN_BOOTSTRAP_LOGIN_ID:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NICKNAME: ${ADMIN_BOOTSTRAP_NICKNAME:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      NEMONIC_SITE_URL: ${NEMONIC_SITE_URL}
      # SMTP — application.yml의 ${MAIL_*} placeholder로 주입.
      # 비어있으면 Spring mail HealthIndicator가 DOWN을 리포트해서
      # /actuator/health가 503을 반환 → smoke test 실패.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      # GMS (LLM gateway) — application.yml의 ${GMS_*} placeholder로 주입.
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_MODEL: ${GMS_MODEL:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-}
      GMS_CONNECT_TIMEOUT_MS: ${GMS_CONNECT_TIMEOUT_MS:-}
      GMS_READ_TIMEOUT_MS: ${GMS_READ_TIMEOUT_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"
    # bash 내장 /dev/tcp 사용 — 런타임 이미지에 curl/wget 미설치.
    # Tomcat이 8080을 listen하는 시점이면 ApplicationContext 부팅이 끝난 상태.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cicd-net

  # ============================================================
  # Frontend (Next.js 16 Standalone)
  # Registry에서 pull
  # 이미지: localhost:5000/nemonic/frontend:latest
  # ============================================================
  frontend:
    image: localhost:5000/nemonic/frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # 백엔드 API endpoint (서버사이드 요청 시 사용)
      # 클라이언트사이드는 /api로 nginx 프록시 통과
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cicd-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  jenkins_home:
  registry_data:

networks:
  cicd-net:
    driver: bridge
