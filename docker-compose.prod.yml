# ============================================================
# infra/dev 브랜치의 docker-compose.prod.yml
#
# Registry 기반 배포로 전환:
# - app, frontend는 build: 가 아닌 image: 사용
# - Jenkins가 이미지 빌드 + push
# - EC2 호스트는 docker pull만
#
# 실행 위치: /opt/nemonic/infra/
# ============================================================

services:
  # ============================================================
  # Nginx - 단일 진입점 (443)
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/.htpasswd_dashboards:/etc/nginx/.htpasswd_dashboards:ro
      - ./deploy/nginx/.htpasswd_grafana:/etc/nginx/.htpasswd_grafana:ro
    depends_on:
      - jenkins
      - minio
      - frontend
    networks:
      - cicd-net

  # ============================================================
  # Container Registry - 자체 호스팅 Docker Registry
  # 외부 노출 없음 (localhost:5000 또는 컨테이너 간 registry:5000)
  # Jenkins가 push, EC2 호스트가 pull
  # ============================================================
  registry:
    image: registry:2
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      # 호스트 docker daemon이 127.0.0.1:5000으로 pull 가능하도록
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cicd-net

  # ============================================================
  # Jenkins - CI/CD 자동 배포
  # ============================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: nemonic/jenkins:latest
    restart: unless-stopped
    user: root
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Dhudson.model.DirectoryBrowserSupport.CSP="
    expose:
      - "8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/nemonic:/opt/nemonic
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - cicd-net

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cicd-net

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cicd-net

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN}/minio/
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cicd-net

  # ============================================================
  # Spring Boot 애플리케이션
  # Registry에서 pull (build 안 함)
  # 이미지: localhost:5000/nemonic/app:latest
  # ============================================================
  app:
    image: localhost:5000/nemonic/app:latest
    pull_policy: always   # 매번 pull 시도 (latest 태그 갱신 감지)
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nemonic}
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - cicd-net

  # ============================================================
  # Frontend (Next.js 16 Standalone)
  # Registry에서 pull
  # 이미지: localhost:5000/nemonic/frontend:latest
  # ============================================================
  frontend:
    image: localhost:5000/nemonic/frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # 백엔드 API endpoint (서버사이드 요청 시 사용)
      # 클라이언트사이드는 /api로 nginx 프록시 통과
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cicd-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  jenkins_home:
  registry_data:

networks:
  cicd-net:
    driver: bridge
