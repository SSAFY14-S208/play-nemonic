spring:
  config:
    import: optional:file:${ENV_FILE:.env}[.properties]

  application:
    name: backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nemonic_local}}
    username: ${DB_USERNAME:nemonic}
    password: ${DB_PASSWORD:nemonic}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: backend
    distribution:
      # Grafana 대시보드의 p50/p95/p99 latency 패널은 histogram_quantile를
      # 호출하므로 *_bucket 시계열이 필요. 이 옵션을 켜야 Micrometer가
      # http.server.requests 메트릭을 bucket 형태로 노출한다.
      percentiles-histogram:
        http.server.requests: true

nemonic:
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}

  auth:
    jwt:
      secret: ${ADMIN_JWT_SECRET:}
      access-token-expiration: ${ADMIN_JWT_ACCESS_TOKEN_EXPIRATION:30m}
      refresh-token-expiration: ${ADMIN_JWT_REFRESH_TOKEN_EXPIRATION:14d}
    admin-bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      nickname: ${ADMIN_BOOTSTRAP_NICKNAME:}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:nemonic-local}
      presign-expiration-minutes: ${MINIO_PRESIGN_EXPIRATION_MINUTES:10}
      view-url-expiration-minutes: ${MINIO_VIEW_URL_EXPIRATION_MINUTES:1440}
      max-upload-byte-size: ${FILE_UPLOAD_MAX_BYTE_SIZE:52428800}

  share:
    site-url: ${NEMONIC_SITE_URL:http://localhost:3000}
    token-secret: ${SHARE_TOKEN_SECRET:${ADMIN_JWT_SECRET:local-share-token-secret-change-me}}

  inquiry:
    mail:
      from: ${MAIL_FROM:${MAIL_USERNAME:}}

  community:
    moderation:
      enabled: ${COMMUNITY_MODERATION_ENABLED:true}
      base-url: ${COMMUNITY_MODERATION_BASE_URL:http://localhost:8000}
      check-path: ${COMMUNITY_MODERATION_CHECK_PATH:/check}
      connect-timeout-ms: ${COMMUNITY_MODERATION_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${COMMUNITY_MODERATION_READ_TIMEOUT_MS:3000}
      fail-closed: ${COMMUNITY_MODERATION_FAIL_CLOSED:false}

  relay:
    reconciliation:
      enabled: ${RELAY_RECONCILIATION_ENABLED:true}
      scan-delay-ms: ${RELAY_RECONCILIATION_SCAN_DELAY_MS:30000}
      scan-limit: ${RELAY_RECONCILIATION_SCAN_LIMIT:100}
    disconnect:
      enabled: ${RELAY_DISCONNECT_ENABLED:true}
      reconnect-grace-seconds: ${RELAY_DISCONNECT_RECONNECT_GRACE_SECONDS:10}
      scan-delay-ms: ${RELAY_DISCONNECT_SCAN_DELAY_MS:1000}
      scan-limit: ${RELAY_DISCONNECT_SCAN_LIMIT:100}
    timeout:
      enabled: ${RELAY_TIMEOUT_ENABLED:true}
      scan-delay-ms: ${RELAY_TIMEOUT_SCAN_DELAY_MS:1000}
      scan-limit: ${RELAY_TIMEOUT_SCAN_LIMIT:100}
      auto-submit-grace-ms: ${RELAY_TIMEOUT_AUTO_SUBMIT_GRACE_MS:2000}
    finalization:
      enabled: ${RELAY_FINALIZATION_ENABLED:true}
      scan-delay-ms: ${RELAY_FINALIZATION_SCAN_DELAY_MS:30000}
      scan-limit: ${RELAY_FINALIZATION_SCAN_LIMIT:50}
      lock-ttl-seconds: ${RELAY_FINALIZATION_LOCK_TTL_SECONDS:120}
      attempt-ttl-hours: ${RELAY_FINALIZATION_ATTEMPT_TTL_HOURS:24}
      max-retry-count: ${RELAY_FINALIZATION_MAX_RETRY_COUNT:20}
      default-part-width: ${RELAY_FINALIZATION_DEFAULT_PART_WIDTH:512}
      default-part-height: ${RELAY_FINALIZATION_DEFAULT_PART_HEIGHT:512}
      thumbnail-max-size: ${RELAY_FINALIZATION_THUMBNAIL_MAX_SIZE:512}
    orphan-cleanup:
      enabled: ${RELAY_ORPHAN_CLEANUP_ENABLED:true}
      scan-delay-ms: ${RELAY_ORPHAN_CLEANUP_SCAN_DELAY_MS:3600000}
      initial-delay-ms: ${RELAY_ORPHAN_CLEANUP_INITIAL_DELAY_MS:3600000}
      scan-limit: ${RELAY_ORPHAN_CLEANUP_SCAN_LIMIT:500}
      temp-retention-hours: ${RELAY_ORPHAN_CLEANUP_TEMP_RETENTION_HOURS:24}
      result-retention-hours: ${RELAY_ORPHAN_CLEANUP_RESULT_RETENTION_HOURS:24}
    abandoned-close:
      enabled: ${RELAY_ABANDONED_CLOSE_ENABLED:true}
      scan-delay-ms: ${RELAY_ABANDONED_CLOSE_SCAN_DELAY_MS:30000}
      scan-limit: ${RELAY_ABANDONED_CLOSE_SCAN_LIMIT:100}
      waiting-idle-seconds: ${RELAY_WAITING_IDLE_CLOSE_SECONDS:300}
      playing-abandoned-seconds: ${RELAY_PLAYING_ABANDONED_CLOSE_SECONDS:300}
    close:
      enabled: ${RELAY_CLOSE_ENABLED:true}
      delay-seconds: ${RELAY_CLOSE_DELAY_SECONDS:300}
      scan-delay-ms: ${RELAY_CLOSE_SCAN_DELAY_MS:30000}
      scan-limit: ${RELAY_CLOSE_SCAN_LIMIT:100}

  flipbook:
    abandoned-close:
      enabled: ${FLIPBOOK_ABANDONED_CLOSE_ENABLED:true}
      scan-delay-ms: ${FLIPBOOK_ABANDONED_CLOSE_SCAN_DELAY_MS:30000}
      scan-limit: ${FLIPBOOK_ABANDONED_CLOSE_SCAN_LIMIT:100}
      waiting-idle-seconds: ${FLIPBOOK_WAITING_IDLE_CLOSE_SECONDS:300}
    disconnect:
      enabled: ${FLIPBOOK_DISCONNECT_ENABLED:true}
      reconnect-grace-seconds: ${FLIPBOOK_DISCONNECT_RECONNECT_GRACE_SECONDS:10}
      scan-delay-ms: ${FLIPBOOK_DISCONNECT_SCAN_DELAY_MS:1000}
      scan-limit: ${FLIPBOOK_DISCONNECT_SCAN_LIMIT:100}
    timeout:
      enabled: ${FLIPBOOK_TIMEOUT_ENABLED:true}
      scan-delay-ms: ${FLIPBOOK_TIMEOUT_SCAN_DELAY_MS:1000}
      scan-limit: ${FLIPBOOK_TIMEOUT_SCAN_LIMIT:100}
      auto-submit-grace-ms: ${FLIPBOOK_TIMEOUT_AUTO_SUBMIT_GRACE_MS:5000}
      submit-lock-ttl-ms: ${FLIPBOOK_TIMEOUT_SUBMIT_LOCK_TTL_MS:10000}
    finalization:
      enabled: ${FLIPBOOK_FINALIZATION_ENABLED:true}
      scan-delay-ms: ${FLIPBOOK_FINALIZATION_SCAN_DELAY_MS:2000}
      scan-limit: ${FLIPBOOK_FINALIZATION_SCAN_LIMIT:50}
      lock-ttl-seconds: ${FLIPBOOK_FINALIZATION_LOCK_TTL_SECONDS:60}
      ready-delay-ms: ${FLIPBOOK_FINALIZATION_READY_DELAY_MS:1000}

  fortune:
    gms:
      api-key: ${GMS_API_KEY:}
      model: ${GMS_MODEL:gpt-5.2}
      base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions}
      connect-timeout-ms: ${GMS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${GMS_READ_TIMEOUT_MS:30000}
