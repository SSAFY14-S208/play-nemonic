spring:
  application:
    name: backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nemonic_local}}
    username: ${DB_USERNAME:nemonic}
    password: ${DB_PASSWORD:nemonic}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

nemonic:
  auth:
    jwt:
      secret: ${ADMIN_JWT_SECRET:}
      access-token-expiration: ${ADMIN_JWT_ACCESS_TOKEN_EXPIRATION:30m}
    admin-bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      nickname: ${ADMIN_BOOTSTRAP_NICKNAME:}
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:nemonic-local}
      presign-expiration-minutes: ${MINIO_PRESIGN_EXPIRATION_MINUTES:10}
      max-upload-byte-size: ${FILE_UPLOAD_MAX_BYTE_SIZE:52428800}
